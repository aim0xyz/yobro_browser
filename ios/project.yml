name: YoBroMobile
options:
  bundleIdPrefix: xyz.aimo.yobro
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    DEVELOPMENT_TEAM: UW6QNH59X9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  YoBroMobile:
    type: application
    platform: iOS
    sources:
      - YoBroMobile
      - ../Sources/YOBRO/SupabaseAuth.swift
      - ../Sources/YOBRO/PersistedState.swift
      - ../Sources/YOBRO/Theme.swift
      - path: ../Sources/YOBRO/Resources/YOBROMark.png
        buildPhase: resources
      - path: ../Sources/YOBRO/Resources/uBlockOriginLite.safari.zip
        buildPhase: resources
      - path: ../Sources/YOBRO/Resources/uBlockOriginLite-NOTICE.txt
        buildPhase: resources
      - path: ../Sources/YOBRO/Resources/DarkReader.js
        buildPhase: resources
      - path: ../Sources/YOBRO/Resources/DarkReader-LICENSE.txt
        buildPhase: resources
    info:
      path: YoBroMobile/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: xyz.aimo.yobro.auth
            CFBundleURLSchemes: [yobro]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.yobro.mobile
        # These are required in the archived app's Info.plist by App Store Connect.
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: YoBro
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: YoBro verwendet die Kamera zum sicheren Scannen eines QR-Codes beim Verbinden eines Geräts. Webseiten erhalten keinen Kamera-Zugriff ohne deine Erlaubnis.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Webseiten können mit deiner Erlaubnis das Mikrofon verwenden.
    entitlements:
      path: YoBroMobile/YoBroMobile.entitlements
      properties:
        com.apple.developer.networking.vpn.api: [allow-vpn]
  YoBroMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: YoBroMobile
schemes:
  YoBroMobile:
    build:
      targets:
        YoBroMobile: all
    test:
      targets: [YoBroMobileTests]
