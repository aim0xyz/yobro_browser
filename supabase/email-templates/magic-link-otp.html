<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#eef1ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#17211b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef1ec;padding:36px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dfe6df;border-radius:22px;overflow:hidden;">
        <tr><td style="padding:34px 38px 18px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:2px;color:#6f8f73;text-transform:uppercase;">YOBRO</div>
          <h1 style="margin:18px 0 12px;font-size:30px;line-height:1.15;letter-spacing:-0.7px;color:#17211b;">Your sign-in code</h1>
          <p style="margin:0;font-size:16px;line-height:1.65;color:#536057;">Enter this one-time code in YOBRO to continue.</p>
        </td></tr>
        <tr><td style="padding:12px 38px 32px;">
          <div style="display:inline-block;background:#f3f6f2;border:1px solid #dfe6df;border-radius:12px;padding:16px 20px;font-size:28px;font-weight:700;letter-spacing:7px;color:#17211b;">{{ .Token }}</div>
          <p style="margin:26px 0 0;font-size:13px;line-height:1.6;color:#7a857d;">This code expires soon and can only be used once. If you did not request it, you can safely ignore this email.</p>
        </td></tr>
        <tr><td style="border-top:1px solid #edf0ed;padding:20px 38px;font-size:12px;line-height:1.6;color:#8b958e;">Never share this code. YOBRO will never ask for it by email, chat, or phone.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
